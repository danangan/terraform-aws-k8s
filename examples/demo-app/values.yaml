image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Keep at 1 - the EBS volume attaches to one node at a time
replicaCount: 1

service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  # Host to route to this service, e.g. api.example.com. Leave empty to
  # match all hosts.
  host: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
