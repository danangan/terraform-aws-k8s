# The built-in pools never launch GPU instances. Nodes start only while a pod
# requests `nvidia.com/gpu`
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [{{ .Values.gpuNodePool.instanceType | quote }}]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      {{- with .Values.gpuNodePool.taints }}
      taints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  limits:
    nvidia.com/gpu: {{ .Values.gpuNodePool.gpuLimit }}
